name: Release

on:
  push:
    branches: [be-dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-arm:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[build]'
      - run: pyinstaller --onefile --hidden-import _cffi_backend --paths . --name kpxc-cli packaging/pyinstaller-entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: kpxc-cli-arm64
          path: dist/kpxc-cli

  build-x86:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[build]'
      - run: pyinstaller --onefile --hidden-import _cffi_backend --paths . --name kpxc-cli packaging/pyinstaller-entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: kpxc-cli-x86_64
          path: dist/kpxc-cli

  release:
    needs: [build-arm, build-x86]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kpxc-cli-arm64
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: kpxc-cli-x86_64
          path: x86_64

      - name: Create universal binary
        run: |
          lipo -create -output kpxc-cli arm64/kpxc-cli x86_64/kpxc-cli
          chmod +x kpxc-cli

      - name: Smoke test universal binary
        run: ./kpxc-cli version

      - name: Compute SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 kpxc-cli | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          # Namespace below upstream's v0.1.0-v3.0.0 tags (inherited by the
          # fork) so versions never collide. 'honk-' is also rejected by the
          # upstream pypi.yml version gate, so its release-published trigger
          # is a no-op on the fork.
          VERSION="honk-v$(date -u +%Y.%m.%d.%H%M%S)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          git tag $VERSION
          git push origin $VERSION
          gh release create $VERSION kpxc-cli \
            --title "$VERSION ($SHORT_SHA)" \
            --notes "Built from $GITHUB_SHA"

      - name: Update homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          SHA256=${{ steps.sha.outputs.sha256 }}
          git clone https://x-access-token:${TAP_TOKEN}@github.com/bennett-elder/homebrew-honk.git
          cd homebrew-honk
          cat > Formula/keepassxc-cli.rb << EOF
          class KeepassxcCli < Formula
            desc "CLI for KeePassXC using the browser extension protocol with biometric unlock"
            homepage "https://github.com/bennett-elder/keepassxc-cli"
            url "https://github.com/bennett-elder/keepassxc-cli/releases/download/${VERSION}/kpxc-cli"
            sha256 "${SHA256}"
            version "${VERSION}"

            def install
              bin.install "kpxc-cli"
            end
          end
          EOF
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add Formula/keepassxc-cli.rb
          git commit -m "Update keepassxc-cli to ${SHORT_SHA}"
          git push